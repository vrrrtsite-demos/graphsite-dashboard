<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GraphSite Analytics</title>
<link id="google-fonts" rel="stylesheet" href="">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    font-family: var(--font-body, 'Inter', sans-serif);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── Header ── */
  #header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  #brand-area { display: flex; align-items: center; gap: 12px; }
  #brand-logo { height: 32px; width: auto; display: block; }
  #brand-wordmark {
    font-size: 20px; font-weight: 800; letter-spacing: -0.5px;
    font-family: var(--font-heading, 'Inter', sans-serif);
  }
  #brand-tag {
    font-size: 11px; font-weight: 600; color: var(--text-muted);
    font-family: var(--font-body, 'Inter', sans-serif);
  }
  #header-right { display: flex; align-items: center; gap: 12px; }
  #sphere-label {
    font-size: 12px; font-weight: 600; color: var(--text-muted);
    background: var(--chip-bg); border: 1px solid var(--border);
    padding: 4px 12px; border-radius: 20px;
  }
  #refresh-btn {
    background: none; border: 1px solid var(--border); color: var(--text-muted);
    font-size: 11px; font-weight: 700; padding: 4px 14px; border-radius: 20px;
    cursor: pointer; font-family: var(--font-body, 'Inter', sans-serif);
    transition: all 0.15s;
  }
  #refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
  #live-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    animation: pulse 2s ease-in-out infinite; flex-shrink: 0;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.4; transform: scale(0.85); }
  }
  #last-updated { font-size: 11px; color: var(--text-faint); }

  /* ── Main ── */
  #main { max-width: 900px; margin: 0 auto; padding: 32px 24px 60px; }
  #page-title { margin-bottom: 24px; }
  #page-title h1 {
    font-size: 22px; font-weight: 800; color: var(--text);
    font-family: var(--font-heading, 'Inter', sans-serif);
  }
  #page-title p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

  /* ── Period ── */
  #period-row { display: flex; gap: 6px; margin-bottom: 24px; }
  .period-btn {
    background: none; border: 1px solid var(--border); color: var(--text-muted);
    font-size: 11px; font-weight: 700; padding: 5px 14px; border-radius: 20px;
    cursor: pointer; font-family: var(--font-body, 'Inter', sans-serif); transition: all 0.15s;
  }
  .period-btn:hover { border-color: var(--accent); color: var(--accent); }
  .period-btn.active { background: var(--accent); border-color: var(--accent); color: var(--accent-text, #fff); }

  /* ── KPI Cards ── */
  #kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .kpi-card {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 12px; padding: 20px 20px 18px;
    position: relative; overflow: hidden;
  }
  .kpi-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 2px; background: var(--stripe, var(--accent)); opacity: 0.8;
  }
  .kpi-card.c1 { --stripe: var(--accent); }
  .kpi-card.c2 { --stripe: #4B9EFF; }
  .kpi-card.c3 { --stripe: #3ECF8E; }
  .kpi-card.c4 { --stripe: #A78BFA; }
  .kpi-label {
    font-size: 10px; font-weight: 700; letter-spacing: 0.8px;
    text-transform: uppercase; color: var(--text-faint); margin-bottom: 10px;
    font-family: var(--font-heading, 'Inter', sans-serif);
  }
  .kpi-value {
    font-size: 38px; font-weight: 800; color: var(--text); line-height: 1;
    letter-spacing: -1px; font-family: var(--font-heading, 'Inter', sans-serif);
  }
  .kpi-sub { font-size: 11px; color: var(--text-muted); margin-top: 6px; }

  /* ── Sections ── */
  .section {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 12px; padding: 22px; margin-bottom: 14px;
  }
  .section-title {
    font-size: 10px; font-weight: 700; letter-spacing: 0.8px;
    text-transform: uppercase; color: var(--text-faint); margin-bottom: 16px;
    font-family: var(--font-heading, 'Inter', sans-serif);
  }

  /* ── Source bars ── */
  .source-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .source-row:last-child { margin-bottom: 0; }
  .source-name {
    font-size: 12px; font-weight: 600; color: var(--text-muted);
    width: 90px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .source-bar-track { flex: 1; background: var(--bar-track); border-radius: 4px; height: 8px; overflow: hidden; }
  .source-bar-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.6s ease; }
  .source-count { font-size: 12px; font-weight: 700; color: var(--text); width: 28px; text-align: right; flex-shrink: 0; }

  /* ── Visitors ── */
  .visitor-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid var(--row-border);
  }
  .visitor-row:last-child { border-bottom: none; }
  .visitor-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--avatar-bg); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: var(--accent); flex-shrink: 0;
    font-family: var(--font-heading, 'Inter', sans-serif);
  }
  .visitor-info { flex: 1; min-width: 0; }
  .visitor-email { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .visitor-anon { font-size: 13px; font-weight: 500; color: var(--text-faint); font-style: italic; }
  .visitor-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .visitor-hub {
    font-size: 11px; font-weight: 700; color: var(--accent);
    background: var(--hub-bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 2px 9px; flex-shrink: 0;
    white-space: nowrap; max-width: 130px; overflow: hidden; text-overflow: ellipsis;
  }
  .visitor-events { font-size: 11px; font-weight: 700; color: var(--text-faint); flex-shrink: 0; }

  /* ── States ── */
  .empty { font-size: 13px; color: var(--text-faint); text-align: center; padding: 24px 0; font-style: italic; }
  #loading-overlay {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 40vh; gap: 12px;
    color: var(--text-muted); font-size: 13px;
  }
  .spinner {
    width: 26px; height: 26px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #error-msg {
    background: rgba(255,50,50,0.06); border: 1px solid rgba(255,50,50,0.18);
    border-radius: 10px; padding: 16px 20px; font-size: 13px; color: #FF6060; text-align: center;
  }

  @media (max-width: 600px) {
    #main { padding: 20px 16px 40px; }
    .kpi-value { font-size: 30px; }
    .section { padding: 16px; }
    #brand-tag { display: none; }
  }
</style>
</head>
<body>

<div id="header">
  <div id="brand-area"></div>
  <div id="header-right">
    <span id="sphere-label"></span>
    <div id="live-dot" title="Auto-refreshing every 15s"></div>
    <span id="last-updated"></span>
    <button id="refresh-btn" onclick="loadData()">Refresh</button>
  </div>
</div>

<div id="main">
  <div id="page-title">
    <h1 id="title-text"></h1>
    <p id="subtitle-text">Real-time engagement data from your GraphSite sphere</p>
  </div>
  <div id="period-row">
    <button class="period-btn active" data-days="1" onclick="setPeriod(1)">Today</button>
    <button class="period-btn" data-days="7" onclick="setPeriod(7)">7 days</button>
    <button class="period-btn" data-days="30" onclick="setPeriod(30)">30 days</button>
    <button class="period-btn" data-days="90" onclick="setPeriod(90)">All time</button>
  </div>
  <div id="content">
    <div id="loading-overlay"><div class="spinner"></div><span>Loading...</span></div>
  </div>
</div>

<script>
  const API = 'https://vrrrt-api-production.up.railway.app';

  // ── Brand / theme config per sphere ──────────────────────────────────
  const BRANDS = {
    'attooh-sphere': {
      name:        'attooh!',
      title:       'attooh! — Sphere Analytics',
      accent:      '#9cd31e',
      accentText:  '#1a3000',
      logoUrl:     'https://images.leadconnectorhq.com/image/f_webp/q_80/r_1200/u_https://assets.cdn.filesafe.space/EnEfD8EkdmRMu6E68Llz/media/872362e7-eb84-43b4-970e-86ba9813aaef.png',
      fontHeading: 'Montserrat',
      fontBody:    'Lato',
      googleFonts: 'https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Lato:wght@400;700&display=swap',
      light: true,
    },
    'inspired-sphere': {
      name:        'Inspired Living SA',
      title:       'Inspired Living — Sphere Analytics',
      accent:      '#8AB4BA',
      accentText:  '#fff',
      fontHeading: 'Fira Sans',
      fontBody:    'Fira Sans',
      googleFonts: 'https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;600;700;800&display=swap',
    },
    'maya-sphere': {
      name:        'Maya on Money',
      title:       'Maya on Money — Sphere Analytics',
      accent:      '#E8A020',
      accentText:  '#fff',
      fontHeading: 'Playfair Display',
      fontBody:    'Lato',
      googleFonts: 'https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Lato:wght@400;700&display=swap',
    },
  };

  const DEFAULT_BRAND = {
    name: 'Vrrrt!', title: 'Sphere Analytics',
    accent: '#FF6535', accentText: '#fff',
    fontHeading: 'Inter', fontBody: 'Inter',
    googleFonts: 'https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap',
  };

  // ── Dark / light token sets ──────────────────────────────────────────
  const DARK_TOKENS = {
    '--bg':         '#0D0D0D',
    '--surface':    '#111111',
    '--border':     '#1E1E1E',
    '--card-bg':    '#161616',
    '--card-border':'#202020',
    '--chip-bg':    '#1A1A1A',
    '--bar-track':  '#1F1F1F',
    '--row-border': '#1C1C1C',
    '--avatar-bg':  '#1E1E1E',
    '--hub-bg':     'rgba(0,0,0,0.3)',
    '--text':       '#F0F0F0',
    '--text-muted': '#666666',
    '--text-faint': '#444444',
  };
  const LIGHT_TOKENS = {
    '--bg':         '#FFFFFF',
    '--surface':    '#FFFFFF',
    '--border':     '#E8E8E8',
    '--card-bg':    '#F8FAF8',
    '--card-border':'#E8EAE8',
    '--chip-bg':    '#F0F0F0',
    '--bar-track':  '#EEEEEE',
    '--row-border': '#F0F0F0',
    '--avatar-bg':  '#F0F5E8',
    '--hub-bg':     'rgba(156,211,30,0.08)',
    '--text':       '#1A1A1A',
    '--text-muted': '#777777',
    '--text-faint': '#AAAAAA',
  };

  // ── Init ─────────────────────────────────────────────────────────────
  const urlParams = new URLSearchParams(window.location.search);
  const SPHERE_ID = urlParams.get('sphere') || 'attooh-sphere';
  const brand = BRANDS[SPHERE_ID] || DEFAULT_BRAND;
  let currentDays = 1;

  // Apply theme tokens
  const tokens = brand.light ? LIGHT_TOKENS : DARK_TOKENS;
  const root = document.documentElement;
  for (const [k, v] of Object.entries(tokens)) root.style.setProperty(k, v);
  root.style.setProperty('--accent', brand.accent);
  root.style.setProperty('--accent-text', brand.accentText);
  root.style.setProperty('--font-heading', `'${brand.fontHeading}', sans-serif`);
  root.style.setProperty('--font-body', `'${brand.fontBody}', sans-serif`);

  // Load fonts
  if (brand.googleFonts) document.getElementById('google-fonts').href = brand.googleFonts;

  // Brand header
  const brandArea = document.getElementById('brand-area');
  if (brand.logoUrl) {
    brandArea.innerHTML = `
      <img id="brand-logo" src="${brand.logoUrl}" alt="${brand.name}"
           onerror="this.style.display='none';document.getElementById('brand-fb').style.display='block'">
      <span id="brand-fb" style="display:none;font-size:18px;font-weight:800;color:var(--accent);font-family:var(--font-heading)">${brand.name}</span>
      <span id="brand-tag">Analytics Dashboard</span>`;
  } else {
    brandArea.innerHTML = `
      <span id="brand-wordmark" style="color:var(--accent);font-family:var(--font-heading)">${brand.name}</span>
      <span id="brand-tag">Analytics Dashboard</span>`;
  }

  document.getElementById('sphere-label').textContent = SPHERE_ID;
  document.getElementById('title-text').textContent = brand.title;
  document.title = brand.title;

  // ── Helpers ──────────────────────────────────────────────────────────
  function setPeriod(days) {
    currentDays = days;
    document.querySelectorAll('.period-btn').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.days) === days);
    });
    loadData();
  }

  function formatDate(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString('en-ZA', {
      day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
    });
  }

  function initial(email) { return (email || '?')[0].toUpperCase(); }

  // ── Render ───────────────────────────────────────────────────────────
  function renderDashboard(data) {
    const c = document.getElementById('content');

    const sources = Object.entries(data.by_source || {}).sort((a, b) => b[1] - a[1]);
    const maxSrc = sources[0]?.[1] || 1;
    const srcHtml = sources.length === 0
      ? '<div class="empty">No source data yet</div>'
      : sources.map(([src, n]) => `
          <div class="source-row">
            <div class="source-name">${src}</div>
            <div class="source-bar-track">
              <div class="source-bar-fill" style="width:${Math.round((n/maxSrc)*100)}%"></div>
            </div>
            <div class="source-count">${n}</div>
          </div>`).join('');

    const visitors = data.hot_visitors || [];
    const visHtml = visitors.length === 0
      ? '<div class="empty">No visitors identified yet — share the sphere link to get started</div>'
      : visitors.map(v => `
          <div class="visitor-row">
            <div class="visitor-avatar">${initial(v.email)}</div>
            <div class="visitor-info">
              ${v.email ? `<div class="visitor-email">${v.email}</div>` : `<div class="visitor-anon">Anonymous visitor</div>`}
              <div class="visitor-meta">Last seen ${formatDate(v.last_seen)}</div>
            </div>
            ${v.top_hub ? `<div class="visitor-hub">${v.top_hub.replace(/-/g,' ')}</div>` : ''}
            <div class="visitor-events">${v.event_count} events</div>
          </div>`).join('');

    const hottest = data.hottest_hub ? data.hottest_hub.replace(/-/g, ' ') : '—';
    const hottestSize = hottest.length > 12 ? '18px' : '28px';

    c.innerHTML = `
      <div id="kpis">
        <div class="kpi-card c1">
          <div class="kpi-label">Total Visitors</div>
          <div class="kpi-value">${data.total_visitors ?? 0}</div>
          <div class="kpi-sub">unique sessions</div>
        </div>
        <div class="kpi-card c2">
          <div class="kpi-label">Deeply Engaged</div>
          <div class="kpi-value">${data.deeply_engaged ?? 0}</div>
          <div class="kpi-sub">5+ interactions</div>
        </div>
        <div class="kpi-card c3">
          <div class="kpi-label">Emails Captured</div>
          <div class="kpi-value">${data.emails_captured ?? 0}</div>
          <div class="kpi-sub">identified visitors</div>
        </div>
        <div class="kpi-card c4">
          <div class="kpi-label">Hottest Topic</div>
          <div class="kpi-value" style="font-size:${hottestSize};letter-spacing:0;line-height:1.2;padding-top:4px;">${hottest}</div>
          <div class="kpi-sub">most clicked hub</div>
        </div>
      </div>
      <div class="section">
        <div class="section-title">Traffic Sources</div>
        ${srcHtml}
      </div>
      <div class="section">
        <div class="section-title">Identified Visitors</div>
        ${visHtml}
      </div>`;
  }

  // ── Fetch ─────────────────────────────────────────────────────────────
  async function loadData() {
    document.getElementById('content').innerHTML =
      `<div id="loading-overlay"><div class="spinner"></div><span>Loading...</span></div>`;
    document.getElementById('last-updated').textContent = '';
    try {
      const res = await fetch(`${API}/analytics/dashboard/${SPHERE_ID}?days=${currentDays}`);
      if (!res.ok) throw new Error(`API ${res.status}`);
      const data = await res.json();
      renderDashboard(data);
      document.getElementById('last-updated').textContent =
        'Updated ' + new Date().toLocaleTimeString('en-ZA', { hour: '2-digit', minute: '2-digit' });
    } catch (err) {
      document.getElementById('content').innerHTML =
        `<div id="error-msg">Could not load data — ${err.message}</div>`;
    }
  }

  loadData();
  setInterval(loadData, 15000);
</script>
</body>
</html>
